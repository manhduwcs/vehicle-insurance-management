{% extends "base.html" %}
{% block content %}
<h2>Vehicle List</h2>
<a href="{% url 'vehicle_create' %}" class="btn btn-primary mb-2">Add Vehicle</a>
<table class="table table-striped">
  <thead>
    <tr><th>#</th><th>License Plate</th><th>Type</th><th>Owner</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for v in vehicles %}
    <tr>
      <td>{{ forloop.counter }}</td>
      <td>{{ v.number }}</td>
      <td>{{ v.vehicle_type.name }}</td>
      <td>{{ v.customer.fullname }}</td>
      <td>
        <a href="{% url 'vehicle_detail' v.pk %}" class="btn btn-sm btn-info">View</a>
        <a href="{% url 'vehicle_update' v.pk %}" class="btn btn-sm btn-warning">Edit</a>
        <form action="{% url 'vehicle_delete' v.pk %}" method="post" style="display:inline">
          {% csrf_token %}
          <button class="btn btn-sm btn-danger" onclick="return confirm('Delete vehicle?')">Delete</button>
        </form>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="5">No vehicles.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
