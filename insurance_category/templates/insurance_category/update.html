{% extends "layouts/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<div class="container-fluid py-4">
  <div class="row">
    <div class="col-md-12 mt-4">
      <div class="card">
        <div class="card-header pb-0 px-3">
          <!-- Category name as title -->
          <h4 class="mb-0">{{ category.name }}</h4>
        </div>
        <div class="card-body pt-4 p-3">
          <form action="{% url 'insurance_category:insurance_category_update' category.id %}" method="post">
            {% csrf_token %}
            
            <!-- Category Name -->
            <div class="input-group mb-3">
              <span class="input-group-text text-body"><i class="fas fa-tag"></i></span>
              <input type="text" name="name" class="form-control" placeholder="Category Name" value="{{ category.name }}">
            </div>

            <!-- Description -->
            <div class="input-group mb-3">
              <span class="input-group-text text-body"><i class="fas fa-info-circle"></i></span>
              <input type="text" name="description" class="form-control" placeholder="Description" value="{{ category.description }}">
            </div>

            <!-- Submit button -->
            <div class="text-end mt-3">
              <button type="submit" class="btn btn-primary">Update Category</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
