{% extends "layouts/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<div class="container-fluid py-4">
  <div class="row">
    <div class="col-md-12 mt-4">
      <div class="card">
        <div class="card-header pb-0 px-3">
          <h4 class="mb-0">Update Contract #{{ contract.contract_no }}</h4>
        </div>
        <div class="card-body pt-4 p-3">
          <form action="{% url 'contracts:contract_update' contract.id %}" method="post">
            {% csrf_token %}

            <!-- Status -->
            <div class="row align-items-start mb-3">
              <!-- Current Status -->
              <div class="col-md-6">
                <label class="form-label fw-bold">Current Contract Status</label>
                <div class="mt-1">
                  <span class="badge bg-secondary px-3 py-2 fs-6 w-100 text-center">
                    {{ contract.get_status_display|default:contract.status }}
                  </span>
                </div>
              </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-danger">New Contract Status</label>
                    <div class="input-group mt-1">
                        <span class="input-group-text text-body"><i class="fas fa-flag"></i></span>
                        {{ form.status }}
                    </div>
                </div>
            </div>

            <!-- Deductible Value -->
            <label class="form-label fw-bold">Deductible Value</label>
            <div class="input-group mb-3">
              <span class="input-group-text text-body"><i class="fas fa-coins"></i></span>
              <input type="number" step="0.01" min="0" name="deductible_value" class="form-control"
                placeholder="Enter the deductible value" value="{{ contract.deductible_value|default_if_none:'' }}">
            </div>

            <!-- Deductible Addon -->
            <label class="form-label fw-bold">Deductible Addon</label>
            <div class="input-group mb-3">
              <span class="input-group-text text-body"><i class="fas fa-plus-circle"></i></span>
              <input type="number" step="0.01" min="0" name="deductible_addon" class="form-control"
                placeholder="Enter the deductible addon" value="{{ contract.deductible_addon|default_if_none:'' }}">
            </div>

            <!-- Actual Value -->
            <label class="form-label fw-bold">Actual Value</label>
            <div class="input-group mb-3">
              <span class="input-group-text text-body"><i class="fas fa-dollar-sign"></i></span>
                <input type="number" step="0.01" min="0" name="actual_value" class="form-control" 
                placeholder="Enter the actual insured value" value="{{ contract.actual_value|default:''|floatformat:-2 }}" 
                oninput="this.value = this.value || ''">
            </div>

            <!-- Actual Premium -->
            <label class="form-label fw-bold">Actual Premium</label>
            <div class="input-group mb-3">
              <span class="input-group-text text-body"><i class="fas fa-wallet"></i></span>
              <input type="number" step="0.01" min="100000" name="actual_premium" class="form-control"
                placeholder="Enter the actual premium amount" value="{{ contract.actual_premium|default_if_none:'' }}">
            </div>


            <!-- Note -->
            <label class="form-label fw-bold">Note</label>
            <div class="input-group mb-3">
              <span class="input-group-text text-body"><i class="fas fa-sticky-note"></i></span>
              <textarea name="note" class="form-control" rows="3" placeholder="Enter any additional notes">{{ contract.note|default_if_none:'' }}</textarea>
            </div>

            <!-- Submit -->
            <div class="text-end mt-3">
              <button type="submit" class="btn btn-primary">Update Contract</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
