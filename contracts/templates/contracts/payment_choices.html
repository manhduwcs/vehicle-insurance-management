{% extends "layouts/base.html" %} {% load static %} {% load humanize %} {% block
content %}

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-soft border-light p-4">
        <h2 class="text-center mb-4">Choose Payment Method</h2>
        <div class="row">
          <!-- Pay with Money -->
          <div class="col-md-4 mb-4">
            <a
              href="{% url 'contract:contract_payment' %}"
              class="btn btn-block btn-primary d-flex align-items-center justify-content-center shadow-soft"
              style="height: 150px"
            >
              <i class="fas fa-money-bill-wave fa-2x mr-3"></i>
              <span class="h4 mb-0">Pay with Money</span>
            </a>
          </div>
          <!-- Pay with Card -->
          <div class="col-md-4 mb-4">
            <button
              class="btn btn-block btn-primary d-flex align-items-center justify-content-center shadow-soft"
              style="height: 150px"
              data-toggle="modal"
              data-target="#cardPaymentModal"
            >
              <i class="fas fa-credit-card fa-2x mr-3"></i>
              <span class="h4 mb-0">Pay with Card</span>
            </button>
          </div>
          <!-- Pay with QR -->
          <div class="col-md-4 mb-4">
            <a
              href="{% url 'contract:contract_payment' %}"
              class="btn btn-block btn-primary d-flex align-items-center justify-content-center shadow-soft"
              style="height: 150px"
            >
              <i class="fas fa-qrcode fa-2x mr-3"></i>
              <span class="h4 mb-0">Pay with QR</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Card Payment Modal -->
  <div
    class="modal fade"
    id="cardPaymentModal"
    tabindex="-1"
    role="dialog"
    aria-labelledby="cardPaymentModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content shadow-soft border-light">
        <div class="modal-header">
          <h5 class="modal-title" id="cardPaymentModalLabel">
            Enter Card Details
          </h5>
          <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form
            id="cardPaymentForm"
            action="{% url 'contract:contract_payment' %}"
            method="POST"
          >
            {% csrf_token %}
            <div class="form-group">
              <label for="cardNumber">Card Number</label>
              <input
                type="text"
                class="form-control"
                id="cardNumber"
                name="card_number"
                placeholder="1234 5678 9012 3456"
                required
                pattern="\d{16}"
                title="Card number must be 16 digits"
              />
            </div>
            <div class="form-group">
              <label for="cardHolder">Card Holder Name</label>
              <input
                type="text"
                class="form-control"
                id="cardHolder"
                name="card_holder"
                placeholder="John Doe"
                required
              />
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label for="expiryDate">Expiry Date</label>
                  <input
                    type="text"
                    class="form-control"
                    id="expiryDate"
                    name="expiry_date"
                    placeholder="MM/YY"
                    required
                    pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
                    title="Enter expiry date in MM/YY format"
                  />
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label for="cvv">CVV</label>
                  <input
                    type="text"
                    class="form-control"
                    id="cvv"
                    name="cvv"
                    placeholder="123"
                    required
                    pattern="\d{3,4}"
                    title="CVV must be 3 or 4 digits"
                  />
                </div>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-3">
              Submit Payment
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- JavaScript for Basic Client-Side Validation -->
<script>
  document
    .getElementById("cardPaymentForm")
    ?.addEventListener("submit", function (event) {
      const cardNumber = document.getElementById("cardNumber").value;
      const expiryDate = document.getElementById("expiryDate").value;
      const cvv = document.getElementById("cvv").value;

      // Basic Luhn Algorithm for Card Number Validation
      function luhnCheck(cardNumber) {
        let sum = 0;
        let isEven = false;
        for (let i = cardNumber.length - 1; i >= 0; i--) {
          let digit = parseInt(cardNumber[i]);
          if (isEven) {
            digit *= 2;
            if (digit > 9) digit -= 9;
          }
          sum += digit;
          isEven = !isEven;
        }
        return sum % 10 === 0;
      }

      if (!luhnCheck(cardNumber.replace(/\s/g, ""))) {
        event.preventDefault();
        alert("Invalid card number.");
      }

      // Expiry Date Validation
      const [month, year] = expiryDate.split("/");
      const currentDate = new Date();
      const currentYear = currentDate.getFullYear() % 100;
      const currentMonth = currentDate.getMonth() + 1;
      if (
        parseInt(year) < currentYear ||
        (parseInt(year) === currentYear && parseInt(month) < currentMonth)
      ) {
        event.preventDefault();
        alert("Card has expired.");
      }
    });
</script>

{% endblock content %}
