{% extends "layouts/home-customer.html" %}
{% load static %}
{% block content %}
<!-- 1234567890123456 -->
<link rel="stylesheet" href="{% static 'css/style.css' %}" />
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 mt-4">
            <div class="card shadow-soft border-light p-4">
                <div class="card-header bg-transparent pb-3">
                    <h5 class="mb-0 text-gradient text-primary">💳 Card Payment</h5>
                    <p class="text-muted mb-0">Securely complete your contract payment below</p>
                </div>
                <div class="card-body">
                    <form id="cardPaymentForm"
                          method="POST"
                          action="{% url 'contracts_customer:contract_payment_card' contract.id %}">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label class="form-label">Card Number</label>
                            <input type="text"
                                   class="form-control border-radius-lg"
                                   name="card_number"
                                   placeholder="1234 5678 9012 3456"
                                   required
                                   pattern="\d{16}"
                                   title="Card number must be 16 digits" />
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label">Card Holder Name</label>
                            <input type="text"
                                   class="form-control border-radius-lg"
                                   name="card_holder"
                                   placeholder="John Doe"
                                   required />
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="form-label">Expiry Date (MM/YY)</label>
                                    <input type="text"
                                           class="form-control border-radius-lg"
                                           name="expiry_date"
                                           placeholder="MM/YY"
                                           required
                                           pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
                                           title="Enter expiry date in MM/YY format" />
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="form-label">CVV</label>
                                    <input type="text"
                                           class="form-control border-radius-lg"
                                           name="cvv"
                                           placeholder="123"
                                           required
                                           pattern="\d{3,4}"
                                           title="CVV must be 3 or 4 digits" />
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="{% url 'contracts_customer:contract_payment' contract.id %}"
                               class="btn btn-outline-secondary mb-0">
                                <i class="fas fa-arrow-left"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-warning text-white shadow-soft mb-0">Confirm Payment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
