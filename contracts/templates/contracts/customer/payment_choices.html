{% extends "layouts/home-customer.html" %}
{% load static %}
{% load humanize %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-soft border-light p-4">
                <h2 class="text-center mb-4">Choose Payment Method</h2>
                <div class="row">
                    <!-- Pay with Money -->
                    <div class="col-md-4 mb-4">
                        <a href="{% url 'contracts_customer:contract_payment_direct' contract.id %}"
                           class="btn btn-primary btn-block d-flex align-items-center justify-content-center"
                           style="height: 120px;
                                  transition: background-color 0.3s ease;
                                  outline: none !important">
                            <i class="fas fa-money-bill-wave fa-2x mr-3"></i>
                            <span class="h4 mb-0">Pay with Money</span>
                        </a>
                    </div>
                    <!-- Pay with Card -->
                    <div class="col-md-4 mb-4">
                        <a href="{% url 'contracts_customer:contract_payment_card' contract.id %}"
                           class="btn btn-primary btn-block d-flex align-items-center justify-content-center"
                           style="height: 120px">
                            <i class="fas fa-credit-card fa-2x mr-3"></i>
                            <span class="h4 mb-0">Pay with Card</span>
                        </a>
                    </div>
                    <!-- Pay with QR -->
                    <div class="col-md-4 mb-4">
                        <a href="{% url 'contracts_customer:contract_payment_qr' contract.id %}"
                           class="btn btn-primary btn-block d-flex align-items-center justify-content-center"
                           style="height: 120px;
                                  transition: background-color 0.3s ease;
                                  outline: none !important">
                            <i class="fas fa-qrcode fa-2x mr-3"></i>
                            <span class="h4 mb-0">Pay with QR</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Card Payment Modal -->
</div>
