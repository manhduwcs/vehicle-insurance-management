<!DOCTYPE html>
<html>
    <head>
        <title>Insurance Categories</title>
    </head>
    <body>
        {% for category in categories %}
            <form method="post" action="{% url 'contracts_customer:list_category' %}">
                {% csrf_token %}
                <input type="hidden" name="category_id" value="{{ category.id }}" />
                <button type="submit">{{ category.name }}</button>
            </form>
        {% endfor %}
    </body>
</html>
